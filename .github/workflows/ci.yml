name: CI

# No `paths-ignore` for docs here, deliberately. The `docs` job below validates frontmatter and
# index staleness, so ignoring `docs/**` at the trigger would mean the one job that exists to
# check documentation could never run on a documentation change. Cost is controlled instead by
# the `changes` filter (Go work is skipped on docs-only pushes) and by the `[skip ci]` convention
# on `docs/internal/**` commits.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.26'
  # Keep in sync with scripts/verify-local.sh, which warns on local drift.
  GOLANGCI_VERSION: v2.13.2

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
      conformance: ${{ steps.filter.outputs.conformance }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
            conformance:
              - 'internal/format/**'
              - 'internal/storage/**'
              - 'internal/proxy/**'
              - 'conformance/**'

  lint:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      # gofumpt runs directly, not only via golangci-lint: only recent golangci releases
      # enforce the gofumpt formatter, so the direct call is what makes this version-proof.
      - name: gofumpt
        run: |
          go install mvdan.cc/gofumpt@latest
          out=$(gofumpt -l .)
          if [ -n "$out" ]; then echo "Unformatted files:"; echo "$out"; exit 1; fi
      - uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_VERSION }}

  test:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go build ./...
      - run: go test -race ./...

  # The conformance suite drives REAL package clients against a real server: minutes, containers,
  # and the only check that proves a format actually works.
  #
  # It runs on pushes to main ONLY, not on pull requests. That is a deliberate, costed decision
  # (conformance-harness.md, resolved CI trigger) and it reintroduces a known hazard: a PR can be
  # green while conformance is broken, which is the same shape as the main-gated integration suite
  # that broke Stackweaver's main twice in one day.
  #
  # The compensating control is NOT optional: CLAUDE.md requires `make conformance` locally before
  # pushing anything under internal/format, internal/storage, internal/proxy or conformance, and
  # the pre-commit hook warns when those paths are staged. If breakage still reaches main, the fix
  # is to move this job onto pull requests, not to relax the rule.
  conformance:
    needs: changes
    if: needs.changes.outputs.conformance == 'true' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Run conformance suite
        run: make conformance

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Validate docs frontmatter and index
        run: node scripts/build-docs-index.js --check
      - name: Fail if the committed index is stale
        run: |
          node scripts/build-docs-index.js
          if ! git diff --quiet -- docs-coverage.json docs-index.json docs/; then
            echo "::error::Docs index is stale. Run 'make docs' and commit the result."
            git diff --stat -- docs-coverage.json docs-index.json docs/
            exit 1
          fi
